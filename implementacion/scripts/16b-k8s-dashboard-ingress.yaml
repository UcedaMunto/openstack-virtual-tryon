# =============================================================================
# IngressRouteTCP — Dashboard Kubernetes por dominio SIN puerto
# -----------------------------------------------------------------------------
#  Rutea https://icc115.kubernetes.com (puerto 443 de Traefik) directo al
#  Dashboard (servicio kubernetes-dashboard, targetPort 8443) con TLS passthrough.
#  Así el certificado del Dashboard se mantiene y no hace falta :30443.
# =============================================================================
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: kubernetes-dashboard-tcp
  namespace: kubernetes-dashboard
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`icc115.kubernetes.com`)
      services:
        - name: kubernetes-dashboard
          port: 443
  tls:
    passthrough: true
