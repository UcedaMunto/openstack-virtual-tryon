---
# =============================================================================
# hosts.yml — Inventario Ansible (YAML) de los 3 nodos
# -----------------------------------------------------------------------------
#  Equivalente en YAML a inventory/nodes.env. Describe los nodos y sus roles
#  (grupos Kolla). Útil para gestionar la infraestructura con Ansible de forma
#  declarativa en cualquier red/empresa.
#
#  Probar:  ansible -i hosts.yml all -m ping
# =============================================================================

all:
  vars:
    ansible_user: uceda
    ansible_become: true
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"

  children:

    # ---- Grupos base de Kolla-Ansible ----------------------------------------
    control:            # control plane de OpenStack
      hosts:
        anfitrion:
          ansible_host: 192.168.0.10
          network_interface: enp2s0f0

    network:            # nodo de red (L3/DHCP/metadata/loadbalancer)
      hosts:
        anfitrion:
          ansible_host: 192.168.0.10
          network_interface: enp2s0f0

    compute:            # nodos de cómputo (Nova)
      hosts:
        anfitrion:
          ansible_host: 192.168.0.10
          network_interface: enp2s0f0
        asus-tuf:
          ansible_host: 192.168.0.126
          network_interface: enp2s0
        server:
          ansible_host: 192.168.0.100
          network_interface: eno1

    storage:            # nodo de almacenamiento (Cinder/Swift)
      hosts:
        asus-tuf:
          ansible_host: 192.168.0.126
          network_interface: enp2s0

    monitoring:         # nodo de monitorización
      hosts:
        anfitrion:
          ansible_host: 192.168.0.10
          network_interface: enp2s0f0

    deployment:         # host de despliegue (Kolla)
      hosts:
        localhost:
          ansible_connection: local

    # ---- Roles de negocio ----------------------------------------------------
    gpu_compute:        # nodo con GPU (FASHN-VTON)
      hosts:
        server:
          ansible_host: 192.168.0.100
