---
# =============================================================================
# group_vars/all.yml — Variables comunes (NO secretas) del proyecto ICC115
# -----------------------------------------------------------------------------
#  Los secretos van en group_vars/vault.yml (encriptado con ansible-vault).
#  Para otra red/empresa: editar aquí (rutas, versiones, VIP, zona horaria).
# =============================================================================

# ---- Credenciales / acceso ---------------------------------------------------
ssh_user: uceda
# La contraseña sudo se inyecta con:  export SUDO_PASSWORD=...  (o vía vault).
sudo_password: "{{ vault_sudo_password | default(lookup('env', 'SUDO_PASSWORD') | default('asdfghjkl', true)) }}"
ansible_become_password: "{{ sudo_password }}"

# ---- Zona horaria ------------------------------------------------------------
timezone: America/Santiago

# ---- Versiones / rutas -------------------------------------------------------
kube_version: "v1.36"
kolla_venv: /opt/kolla-ansible
kolla_config_dir: /etc/kolla
kolla_vip: 192.168.0.200

# ---- Arquitectura para el repo de Docker (amd64 en x86_64) -------------------
docker_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"
