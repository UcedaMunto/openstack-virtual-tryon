---
# =============================================================================
# playbooks/07-kolla-config.yml
# -----------------------------------------------------------------------------
#  Genera el inventario Kolla (multinode) + globals.yml + passwords.
#  Equivale a scripts/07-kolla-config.sh.
# =============================================================================
- name: "07 — Configuración Kolla (multinode + globals.yml + passwords)"
  hosts: control
  become: true

  vars:
    kolla_inv: "{{ kolla_config_dir }}/multinode"
    kolla_globals: "{{ kolla_config_dir }}/globals.yml"

  tasks:
    - name: Crear directorio {{ kolla_config_dir }}
      file:
        path: "{{ kolla_config_dir }}"
        state: directory
        mode: "0755"

    - name: Generar inventario Kolla (multinode)
      copy:
        dest: "{{ kolla_inv }}"
        mode: "0644"
        content: |
          # Inventario Kolla-Ansible (generado por playbook 07)
          [control]
          {{ node01_name }} ansible_host={{ node01_ip }} network_interface={{ node01_nic }}

          [network]
          {{ node01_name }} ansible_host={{ node01_ip }} network_interface={{ node01_nic }}

          [compute]
          {{ node01_name }} ansible_host={{ node01_ip }} network_interface={{ node01_nic }}
          {{ node02_name }} ansible_host={{ node02_ip }} network_interface={{ node02_nic }}
          {{ node03_name }} ansible_host={{ node03_ip }} network_interface={{ node03_nic }}

          [storage]
          {{ node02_name }} ansible_host={{ node02_ip }} network_interface={{ node02_nic }}

          [monitoring]
          {{ node01_name }} ansible_host={{ node01_ip }} network_interface={{ node01_nic }}

          [deployment]
          localhost ansible_connection=local

    - name: Añadir mapeos :children estándar + variables de conexión
      shell: |
        SRC={{ kolla_venv }}/share/kolla-ansible/ansible/inventory/multinode
        if [ -f "$SRC" ]; then
          awk '/^\[baremetal:children\]/,0' "$SRC" >> {{ kolla_inv }}
        fi
        cat >> {{ kolla_inv }} <<'EOF'

        [all:vars]
        ansible_user={{ ssh_user }}
        ansible_become=true
        ansible_python_interpreter=/usr/bin/python3
        ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes'
        EOF
      changed_when: false

    - name: Generar globals.yml
      copy:
        dest: "{{ kolla_globals }}"
        mode: "0644"
        content: |
          # globals.yml — generado por playbook 07
          kolla_base_distro: "ubuntu"
          kolla_install_type: "binary"
          openstack_release: "2025.2"
          kolla_internal_vip_address: "{{ kolla_vip }}"

    - name: Generar passwords (kolla-genpwd)
      command: "{{ kolla_venv }}/bin/kolla-genpwd"
      args:
        chdir: "{{ kolla_config_dir }}"
      changed_when: false
