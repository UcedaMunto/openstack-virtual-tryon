---
# =============================================================================
# playbooks/04-openstack-cli.yml
# -----------------------------------------------------------------------------
#  python-openstackclient en el venv de Kolla (control). Equivale a
#  scripts/04-openstack-cli.sh.
# =============================================================================
- name: "04 — python-openstackclient en el venv"
  hosts: control
  become: true

  tasks:
    - name: Instalar clientes OpenStack en el venv
      command: "{{ kolla_venv }}/bin/pip install python-openstackclient python-glanceclient python-neutronclient python-novaclient python-cinderclient"
      changed_when: false
