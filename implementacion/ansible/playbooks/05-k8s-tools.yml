---
# =============================================================================
# playbooks/05-k8s-tools.yml
# -----------------------------------------------------------------------------
#  kubectl + helm en los 3 nodos. Equivale a scripts/05-k8s-tools.sh.
#  (el clúster k3s se despliega aparte, en 16-k8s.yml)
# =============================================================================
- name: "05 — kubectl + helm"
  hosts: nodes
  become: true

  tasks:
    - name: Crear directorio de keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Añadir clave y repositorio de Kubernetes
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kube_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kube_version }}/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
      args:
        creates: /etc/apt/sources.list.d/kubernetes.list

    - name: Instalar kubectl
      apt:
        name: kubectl
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Instalar helm
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm
