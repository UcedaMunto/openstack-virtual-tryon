---
# =============================================================================
# playbooks/16_k8s_cluster.yml — Clúster Kubernetes (adicional al numeral 58)
# -----------------------------------------------------------------------------
#  k3s: server en el control, agents en los otros nodos, Dashboard + ruta por
#  dominio (IngressRouteTCP). El numeral 58 prevé Kubernetes en VMs; en esta
#  etapa se despliega sobre el bare metal.
# =============================================================================

- name: "16 — k3s server en el control"
  hosts: control
  become: true

  tasks:
    - name: Instalar k3s server
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Habilitar y arrancar k3s
      systemd:
        name: k3s
        enabled: true
        state: started

    - name: Leer token de nodo
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token

    - name: Exponer token como fact
      set_fact:
        node_token: "{{ k3s_node_token.content | b64decode | trim }}"

- name: "16 — k3s agents en los computes"
  hosts: "physical_nodes,!anfitrion"
  become: true

  tasks:
    - name: Instalar k3s agent
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ hostvars['anfitrion'].ansible_host }}:6443 K3S_TOKEN={{ hostvars['anfitrion'].node_token }} sh -
      args:
        creates: /usr/local/bin/k3s

- name: "16 — Dashboard Kubernetes + IngressRouteTCP"
  hosts: control
  become: false

  tasks:
    - name: Copiar kubeconfig a ~/.kube/config
      become: true
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        remote_src: true
        mode: "0600"

    - name: Desplegar Dashboard Kubernetes
      command: kubectl apply -f https://raw.githubusercontent.com/kubernetes/dashboard/v2.7.0/aio/deploy/recommended.yaml
      changed_when: false

    - name: Exponer Dashboard en NodePort 30443
      command: kubectl -n kubernetes-dashboard patch svc kubernetes-dashboard -p '{"spec":{"type":"NodePort","ports":[{"port":443,"targetPort":8443,"nodePort":30443}]}}'
      changed_when: false

    - name: Crear admin-user + ClusterRoleBinding
      shell: |
        kubectl apply -f - <<'EOF'
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: admin-user
          namespace: kubernetes-dashboard
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: admin-user
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
        - kind: ServiceAccount
          name: admin-user
          namespace: kubernetes-dashboard
        EOF
      changed_when: false

    - name: Ruta IngressRouteTCP (dominio sin puerto)
      shell: |
        kubectl apply -f - <<'EOF'
        apiVersion: traefik.io/v1alpha1
        kind: IngressRouteTCP
        metadata:
          name: kubernetes-dashboard-tcp
          namespace: kubernetes-dashboard
        spec:
          entryPoints:
            - websecure
          routes:
            - match: HostSNI(`icc115.kubernetes.com`)
              services:
                - name: kubernetes-dashboard
                  port: 443
          tls:
            passthrough: true
        EOF
      changed_when: false
