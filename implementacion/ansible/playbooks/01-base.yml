---
# =============================================================================
# playbooks/01-base.yml
# -----------------------------------------------------------------------------
#  Paquetes base + chrony (NTP) en los 3 nodos. Equivale a scripts/01-base.sh.
# =============================================================================
- name: "01 — Paquetes base + chrony (NTP)"
  hosts: nodes
  become: true

  tasks:
    - name: Actualizar caché de apt
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar paquetes base
      apt:
        name:
          - curl
          - wget
          - git
          - vim
          - htop
          - net-tools
          - ca-certificates
          - gnupg
          - lsb-release
          - software-properties-common
          - chrony
          - python3
          - python3-pip
          - python3-venv
          - jq
          - unzip
          - bash-completion
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Habilitar y arrancar chrony (NTP)
      systemd:
        name: chrony
        enabled: true
        state: started
