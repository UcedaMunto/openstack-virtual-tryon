---
# =============================================================================
# playbooks/08-kolla-bootstrap.yml
# -----------------------------------------------------------------------------
#  kolla-ansible bootstrap-servers + prechecks. Equivale a scripts/08-kolla-bootstrap.sh.
# =============================================================================
- name: "08 — Kolla bootstrap-servers + prechecks"
  hosts: control
  become: false

  tasks:
    - name: bootstrap-servers
      shell: |
        export PATH={{ kolla_venv }}/bin:$PATH
        {{ kolla_venv }}/bin/kolla-ansible bootstrap-servers -i {{ kolla_config_dir }}/multinode
      changed_when: false

    - name: prechecks
      shell: |
        export PATH={{ kolla_venv }}/bin:$PATH
        {{ kolla_venv }}/bin/kolla-ansible prechecks -i {{ kolla_config_dir }}/multinode
      changed_when: false
