---
# rol kolla_host — Kolla-Ansible (venv) + clientes OpenStack (solo control)

- name: Instalar dependencias de compilación
  apt:
    name:
      - python3-venv
      - python3-dev
      - libffi-dev
      - gcc
      - libssl-dev
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Crear venv {{ kolla_venv }}
  command: python3 -m venv {{ kolla_venv }}
  args:
    creates: "{{ kolla_venv }}"

- name: Instalar kolla-ansible en el venv
  command: "{{ kolla_venv }}/bin/pip install --upgrade pip 'ansible-core>=2.16,<2.19' kolla-ansible"
  changed_when: false

- name: Instalar clientes OpenStack en el venv
  command: "{{ kolla_venv }}/bin/pip install python-openstackclient python-glanceclient python-neutronclient python-novaclient python-cinderclient"
  changed_when: false

- name: Copiar ejemplos de configuración a {{ kolla_config_dir }}
  shell: |
    mkdir -p {{ kolla_config_dir }}
    cp -r {{ kolla_venv }}/share/kolla-ansible/etc_examples/kolla/* {{ kolla_config_dir }}/ 2>/dev/null || true
    cp {{ kolla_venv }}/share/kolla-ansible/ansible/inventory/* {{ kolla_config_dir }}/ 2>/dev/null || true
  changed_when: false
