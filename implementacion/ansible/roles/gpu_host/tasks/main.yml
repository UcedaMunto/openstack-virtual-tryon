---
# rol gpu_host — runtime NVIDIA para containerd (solo nodo GPU)

- name: Verificar driver NVIDIA
  command: nvidia-smi --query-gpu=name --format=csv,noheader
  register: nvidia_smi
  changed_when: false
  failed_when: false

- name: Abortar si no hay driver NVIDIA
  fail:
    msg: "No hay driver NVIDIA en {{ inventory_hostname }} (nvidia-smi no responde)"
  when: nvidia_smi.rc != 0

- name: Añadir clave y repositorio de nvidia-container-toolkit
  shell: |
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' > /etc/apt/sources.list.d/nvidia-container-toolkit.list
  args:
    creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

- name: Instalar nvidia-container-toolkit
  apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Configurar runtime NVIDIA en containerd
  command: nvidia-ctk runtime configure --runtime=containerd

- name: Reiniciar containerd
  systemd:
    name: containerd
    state: restarted
