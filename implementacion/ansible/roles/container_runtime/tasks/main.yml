---
# rol container_runtime — Docker CE + containerd (prerrequisito de Kolla/K8s)

- name: Crear directorio de keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Descargar clave GPG de Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Añadir repositorio de Docker
  apt_repository:
    repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Instalar Docker CE
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Habilitar y arrancar Docker
  systemd:
    name: docker
    enabled: true
    state: started

- name: Añadir {{ ssh_user }} al grupo docker
  user:
    name: "{{ ssh_user }}"
    groups: docker
    append: true
