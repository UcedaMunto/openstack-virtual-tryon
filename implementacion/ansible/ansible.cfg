[defaults]
# Inventario por defecto (equivalente a: ansible-playbook -i inventory/baremetal.yml)
inventory = inventory/baremetal.yml
# Roles propios en ./roles (ejecutar desde este directorio ansible/)
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3
timeout = 30
stdout_callback = yaml

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
ssh_common_args = -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
