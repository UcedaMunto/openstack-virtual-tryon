apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: k8s-lab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.90.50-192.168.90.50
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: k8s-lab-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - k8s-lab-pool
