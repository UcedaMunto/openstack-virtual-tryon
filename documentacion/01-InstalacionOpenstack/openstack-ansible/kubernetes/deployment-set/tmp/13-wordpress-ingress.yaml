# Ingress de WordPress con TLS (requisito 5 del PDF: https://[IP-flotante]/)
# El certificado vive en el Secret wordpress-tls (autofirmado, CN=192.168.90.50).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress
  namespace: wordpress
spec:
  ingressClassName: nginx
  tls:
    - secretName: wordpress-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
