apiVersion: v1
kind: Pod
metadata:
  name: cephfs-test-pod
spec:
  restartPolicy: Never
  containers:
    - name: tester
      image: busybox:1.36
      command:
        - sh
        - -c
        - "echo hola-cephfs-$(date +%s) > /mnt/test.txt && cat /mnt/test.txt && sleep 30"
      volumeMounts:
        - name: data
          mountPath: /mnt
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: cephfs-test
