---
# Tasks del role neutron-ovs-agent

- name: Instalar neutron-openvswitch-agent
  apt:
    name: neutron-openvswitch-agent
    state: present

- name: Configurar openvswitch_agent.ini
  template:
    src: openvswitch_agent.ini.j2
    dest: /etc/neutron/plugins/ml2/openvswitch_agent.ini
    owner: neutron
    group: neutron
    mode: '0640'
  notify: reiniciar neutron-openvswitch-agent

- name: Habilitar y arrancar neutron-openvswitch-agent
  service:
    name: neutron-openvswitch-agent
    state: started
    enabled: true
