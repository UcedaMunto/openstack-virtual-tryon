---
# playbooks/controller.yml
# Verificar y gestionar servicios del controller

- name: Verificar y gestionar el controller OpenStack
  hosts: controller
  become: true
  tasks:
    - name: Recopilar facts de servicios
      service_facts:

    - name: Verificar servicios esenciales del controller
      assert:
        that: "ansible_facts.services[item + '.service'].state == 'running'"
        fail_msg: "Servicio {{ item }} NO está activo en el controller"
        success_msg: "{{ item }} OK"
      loop:
        - nova-api
        - nova-conductor
        - nova-scheduler
        - neutron-server
        - neutron-l3-agent
        - neutron-dhcp-agent
        - neutron-openvswitch-agent
        - apache2
        - mariadb
        - rabbitmq-server
        - memcached
      tags: verify

    - name: Descubrir y registrar nuevos computes
      command: nova-manage cell_v2 discover_hosts --verbose
      register: discover_result
      changed_when: "'Found' in discover_result.stdout"
      tags: discover

    - name: Mostrar resultado de discover_hosts
      debug:
        msg: "{{ discover_result.stdout_lines }}"
      tags: discover

    - name: Listar compute services
      command: "bash -c 'source {{ admin_openrc_path }} && openstack compute service list -f table'"
      register: compute_services
      changed_when: false
      tags: verify

    - name: Mostrar compute services
      debug:
        msg: "{{ compute_services.stdout_lines }}"
      tags: verify

    - name: Listar network agents
      command: "bash -c 'source {{ admin_openrc_path }} && openstack network agent list -f table'"
      register: network_agents
      changed_when: false
      tags: verify

    - name: Mostrar network agents
      debug:
        msg: "{{ network_agents.stdout_lines }}"
      tags: verify

    - name: Verificar que todos los computes están UP
      assert:
        that: "'down' not in compute_services.stdout"
        fail_msg: "Hay computes DOWN"
        success_msg: "Todos los computes están UP"
      tags: verify
