---
# playbooks/site.yml
# ─────────────────────────────────────────────────────────────────────────────
# Playbook MAESTRO — ejecuta el despliegue completo en el orden correcto.
#
# Uso:
#   cd documentacion_ansible/ansible/
#   ansible-playbook playbooks/site.yml
#
# Para ejecutar solo una fase:
#   ansible-playbook playbooks/site.yml --tags bridges
#   ansible-playbook playbooks/site.yml --tags compute
#   ansible-playbook playbooks/site.yml --tags verify
# ─────────────────────────────────────────────────────────────────────────────

# ── Fase 1: Linux bridges + OVS en todos los nodos ───────────────────────────
- import_playbook: bridges.yml
  tags: bridges

# ── Fase 2: Servicios en los computes ────────────────────────────────────────
- import_playbook: computes.yml
  tags: compute

# ── Fase 3: Verificación final ────────────────────────────────────────────────
- import_playbook: verify.yml
  tags: verify
