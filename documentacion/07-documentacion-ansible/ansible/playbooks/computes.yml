- name: Configurar servicios OpenStack en los computes
  hosts: compute
  become: true
  roles:
    - role: nova-compute
      tags: [compute, nova]
    - role: neutron-ovs-agent
      tags: [compute, neutron]
    - role: ovs-bridges
      tags: [compute, ovs]
